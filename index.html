<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Lofi Lobby</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Silkscreen, monospace; }
  canvas { display: block; image-rendering: pixelated; }
  .glass { position: fixed; background: rgba(10,11,16,.84); border: 1px solid rgba(255,255,255,.16);
           border-radius: 8px; backdrop-filter: blur(10px); color: #F2F2F5; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  #place { left: 28px; top: 28px; padding: 12px 20px; }
  #place b { display: block; font-size: 22px; font-weight: 400; }
  #place small { color: #C4C6D4; font-size: 12px; }
  #place .tools { display: flex; gap: 6px; margin-top: 10px; }
  #place .tools button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; font: inherit; font-size: 14px;
                         color: #F2F2F5; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; cursor: pointer; }
  #place .tools button { position: relative; }
  /* instant label under each icon: what it does and its key */
  #place .tools button::after { content: attr(aria-label); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
                                white-space: nowrap; font-size: 10px; padding: 4px 7px; border-radius: 4px; color: #F2F2F5; background: rgba(0,0,0,.88);
                                border: 1px solid rgba(255,255,255,.16); pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 3; }
  /* the shortcut key in the button's corner */
  #place .tools button[data-key]::before { content: attr(data-key); position: absolute; right: 2px; bottom: 1px; font-size: 7px; line-height: 7px; color: #9a9db0; }
  #place .tools button[data-key]:hover::before, #place .tools button.on::before { color: inherit; }
  #place .tools button:hover::after, #place .tools button.confirm::after { opacity: 1; }
  #place .tools button.confirm { border-color: #ff8a6b; color: #ff8a6b; }
  #place .tools button.confirm::after { content: "click again to respawn"; color: #ff8a6b; }
  #place .tools button[hidden] { display: none; }
  #place .tools button:hover, #place .tools button.on { border-color: #ffc95a; color: #ffc95a; }
  #hint { left: 28px; top: 176px; padding: 12px 16px; font-size: 11px; color: #C4C6D4; transition: opacity .4s; }
  #hint[hidden] { display: none; }
  #hint.fade { opacity: 0; }
  #hint b { display: block; font-weight: 400; color: #ffc95a; margin-bottom: 8px; }
  #hint dl { display: grid; grid-template-columns: auto auto; gap: 4px 14px; margin: 0; }
  #hint dt { color: #F2F2F5; } #hint dd { margin: 0; }
  #radio { left: 28px; bottom: 28px; padding: 8px; display: flex; gap: 10px; align-items: center; max-width: 360px; }
  #radio .tv { position: relative; width: 112px; height: 63px; border-radius: 4px; overflow: hidden; background: #000; flex-shrink: 0; pointer-events: none; }
  #radio .tv iframe { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  #radio .tv .tv-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #radio .tv .tv-cover[hidden] { display: none; }
  #radio small { display: block; color: #C4C6D4; font-size: 11px; margin-bottom: 4px; }
  #mute { display: inline-grid; place-items: center; vertical-align: middle; margin-left: 6px; width: 22px; height: 22px; padding: 0;
          color: #F2F2F5; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.16); border-radius: 6px; cursor: pointer; pointer-events: auto; }
  #mute:hover, #mute.on { border-color: #ffc95a; color: #ffc95a; }
  #volume { width: 64px; height: 14px; margin: 0 0 0 8px; vertical-align: middle; accent-color: #ffc95a; cursor: pointer; pointer-events: auto; }
  @media (pointer: coarse) { #volume { display: none; } } /* phones use the device volume */
  #radio b { display: block; font-weight: 400; font-size: 13px; line-height: 18px; }
  #chat { right: 20px; top: 20px; bottom: 20px; width: 320px; display: flex; flex-direction: column; }
  #chat header { padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,.12); display: flex; justify-content: space-between; align-items: baseline; }
  #chat header b { font-weight: 400; font-size: 18px; }
  #chat header small { color: #C4C6D4; font-size: 11px; }
  /* min-height: 0 lets the list shrink and scroll inside the flex column; margin-top: auto on the
     first message keeps few messages at the bottom (justify-content: flex-end would cut off the top) */
  #msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
          padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; }
  #msgs > :first-child { margin-top: auto; }
  #msgs .m small { display: block; font-size: 11px; color: #ffc95a; margin-bottom: 2px; }
  #msgs .m span { font-size: 13px; line-height: 20px; color: #F2F2F5; overflow-wrap: anywhere; }
  #chat form { padding: 14px 16px 16px; display: flex; gap: 8px; }
  #chat input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: #F2F2F5; background: rgba(0,0,0,.35);
                border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 10px 12px; outline: none; }
  #chat input:focus { border-color: #ffc95a; }
  #send { display: grid; place-items: center; width: 42px; flex-shrink: 0; color: #1b1406; background: #ffc95a; border: 0; border-radius: 6px; padding: 0; cursor: pointer; }
  #send:hover { background: #ffd47a; }
  #send:active { transform: translateY(1px); }
  #chat input::placeholder { color: #9a9db0; }
  /* bubble + arrow as a single shape (clip-path): one background, no double
     transparency where the arrow meets the bubble; the outline comes from the shape's drop-shadow */
  .bubble { position: fixed; transform: translate(-50%, -100%); pointer-events: none; z-index: 2;
           transition: opacity .3s; filter: drop-shadow(0 0 0.6px rgba(255,255,255,.55)); }
  .bubble span { display: block; max-width: 220px; padding: 6px 10px 13px; font-size: 12px; line-height: 16px;
                color: #F2F2F5; text-align: center; overflow-wrap: anywhere; background: rgba(0,0,0,.74);
                clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(50% + 6px) calc(100% - 7px),
                                   50% 100%, calc(50% - 6px) calc(100% - 7px), 0 calc(100% - 7px)); }
  .tag.mod { pointer-events: auto; cursor: pointer; }
  .tag.mod:hover, #msgs .m small.mod:hover { color: #ffc95a; text-decoration: underline; }
  #msgs .m small.mod { cursor: pointer; }
  #mod-menu { position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 6px; padding: 10px; min-width: 120px; }
  #mod-menu[hidden] { display: none; }
  #mod-menu b { font-size: 11px; color: #ffc95a; }
  #mod-menu .who { font-size: 10px; line-height: 15px; color: #b8bccb; white-space: pre-line; max-width: 220px; overflow-wrap: anywhere; }
  #mod-menu button { font: inherit; font-size: 11px; color: #F2F2F5; background: rgba(0,0,0,.4); cursor: pointer;
                     border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 4px 10px; text-align: left; }
  #mod-menu button:hover { border-color: #ff6b6b; color: #ff6b6b; }
  .tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; z-index: 1; white-space: nowrap;
         font-size: 10px; line-height: 14px; color: #F2F2F5;
         /* no background: dark outline so it reads over light grass and lamp light */
         text-shadow: 1px 0 0 #000, -1px 0 0 #000, 0 1px 0 #000, 0 -1px 0 #000; }
  /* admin: a badge over the name and a highlighted chat line, so everyone knows who moderates */
  .tag .badge { display: none; width: fit-content; margin: 0 auto 2px; padding: 1px 5px; border-radius: 3px;
                font-size: 8px; line-height: 11px; font-weight: 400; color: #1b1406; background: #ffc95a; text-shadow: none; }
  .tag.admin .badge { display: block; }
  .tag.admin .who { color: #ffc95a; }
  .tag .who { display: block; text-align: center; }
  /* "press E to sit", floating over the nearest free seat */
  #sit-prompt { position: fixed; transform: translate(-50%, -100%); cursor: pointer; z-index: 1; white-space: nowrap;
                font: inherit; font-size: 12px; line-height: 16px; color: #F2F2F5; padding: 5px 10px; border-radius: 6px;
                background: rgba(10,11,16,.84); border: 1px solid rgba(255,255,255,.16); }
  #sit-prompt[hidden] { display: none; }
  #sit-prompt kbd { font: inherit; color: #ffc95a; padding: 0 4px; border: 1px solid #ffc95a; border-radius: 3px; }
  #sit-prompt .tap { display: none; }
  @media (pointer: coarse) { #sit-prompt .key { display: none; } #sit-prompt .tap { display: inline; } } /* no keyboard: tap it */
  #msgs .m.admin small { color: #1b1406; background: #ffc95a; width: fit-content; padding: 0 5px; border-radius: 3px; }
  #msgs .m.admin small::after { content: " · admin"; }
  #my-name { font: inherit; color: #ffc95a; background: none; border: 0; padding: 0; cursor: pointer; }
  #my-name:hover { text-decoration: underline; }
  #name-input { font: inherit; font-size: 11px; color: #F2F2F5; background: rgba(0,0,0,.4); width: 120px;
              border: 1px solid #ffc95a; border-radius: 4px; padding: 2px 6px; outline: none; }
  #admin-login { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20;
                 display: flex; flex-direction: column; gap: 10px; padding: 18px; width: min(300px, calc(100vw - 32px)); }
  #admin-login[hidden] { display: none; }
  #admin-login b { font-size: 12px; color: #ffc95a; }
  #admin-login input { font: inherit; font-size: 13px; color: #F2F2F5; background: rgba(0,0,0,.45);
                       border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 8px 10px; }
  #admin-login div { display: flex; gap: 8px; justify-content: flex-end; }
  #admin-login button { font: inherit; font-size: 11px; color: #F2F2F5; background: rgba(0,0,0,.4); cursor: pointer;
                        border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 5px 12px; }
  #admin-login button[type=submit] { border-color: #ffc95a; color: #ffc95a; }
  #admin { display: flex; gap: 6px; margin-top: 8px; }
  #admin[hidden] { display: none; }
  #admin button { font: inherit; font-size: 14px; color: #F2F2F5; background: rgba(0,0,0,.4);
                  border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #admin button:hover { border-color: #ffc95a; color: #ffc95a; }
  #enter { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,12,.55); backdrop-filter: blur(3px); z-index: 10; }
  #enter[hidden] { display: none; }
  #enter .box { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 28px;
                   background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; color: #F2F2F5; }
  #enter .box small { color: #A6A8B8; font-size: 12px; }
  #enter .name-field { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #enter-name { font: inherit; font-size: 16px; text-align: center; color: #ffc95a; background: rgba(0,0,0,.4); width: 220px;
                border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 10px 12px; outline: none; }
  #enter-name:focus { border-color: #ffc95a; }
  #place .me { margin-top: 6px; font-size: 11px; color: #C4C6D4; }
  #enter .genders { display: flex; gap: 10px; }
  #enter .genders button { font-size: 14px; padding: 10px 18px; }
  #enter .genders button.on { border-color: #ffc95a; color: #ffc95a; }
  #enter button { font: inherit; font-size: 18px; color: #F2F2F5; background: rgba(10,10,14,.75); border: 1px solid rgba(255,255,255,.2);
                   border-radius: 8px; padding: 16px 28px; cursor: pointer; }
  #enter button:hover { border-color: #ffc95a; color: #ffc95a; }
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; z-index: 3; pointer-events: none;
           border: 1px solid rgba(255,255,255,.25); background: rgba(10,10,14,.25); display: none; }
  #stick.on { display: block; }
  #stick .knob { position: absolute; left: 34px; top: 34px; width: 44px; height: 44px; border-radius: 50%;
                 background: rgba(255,201,90,.55); border: 1px solid #ffc95a; }
  #chat-toggle, #pause-btn { display: none !important; }
  @media (pointer: coarse) { #pause-btn { display: grid !important; } #help { display: none !important; } }

  /* phones and tablets */
  @media (pointer: coarse) {
    canvas { touch-action: none; }
    #hint { display: none; }
    #place { left: 12px; top: calc(12px + env(safe-area-inset-top)); padding: 10px 14px 12px; max-width: calc(100vw - 24px); }
    #place b { font-size: 16px; }
    #place small { display: block; font-size: 10px; }
    #place .tools button { width: 36px; height: 36px; }
    #place small { margin-top: 2px; }
    #radio { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 130px); padding: 6px; gap: 8px; }
    #radio .tv { width: 96px; height: 54px; }
    #radio > div:last-child { min-width: 0; }
    #radio b { font-size: 10px; line-height: 13px; max-height: 26px; overflow: hidden; }
    #radio small { font-size: 9px; }
    #chat-toggle { display: block; position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4;
                   font: inherit; font-size: 13px; color: #F2F2F5; background: rgba(10,10,14,.75); border: 1px solid rgba(255,255,255,.2);
                   border-radius: 22px; padding: 10px 16px; }
    #chat-toggle.unread::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: #ffc95a; }
    #chat { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 46vh; border-radius: 12px 12px 0 0;
            padding-bottom: env(safe-area-inset-bottom); transform: translateY(100%); transition: transform .2s; z-index: 5; }
    #chat.open { transform: none; }
    /* close button floats above the open sheet, with room to breathe */
    #chat.open ~ #chat-toggle, body:has(#chat.open) #chat-toggle { bottom: calc(46vh + env(safe-area-inset-bottom) + 12px); z-index: 6; }
    #chat-toggle { transition: bottom .2s; }
    body:has(#chat.open) #radio { display: none; } /* the sheet covers it anyway */
    #chat header { padding: 12px 16px 10px; }
    #chat input { font-size: 16px; } /* 16px+ keeps iOS from zooming in */
  }
</style>
</head>
<body>
<div id="place" class="glass"><b>Lofi Lobby</b><small>1 online</small>
  <div class="me">you: <button id="my-name" title="change name"></button> ✎</div>
  <div class="tools">
    <button id="day-night" type="button" data-key="N" aria-label="make it day"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button id="rain" type="button" data-key="R" aria-label="make it rain"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5A4.5 4.5 0 0 0 17.5 7a6 6 0 0 0-11.4 2A4 4 0 0 0 6 17"/><path d="M8 19v2M12 17v4M16 19v2"/></svg></button>
    <button id="hold" type="button" data-key="Q" aria-label="hold a laptop" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v2M12 3v2"/></svg></button>
    <button id="switch-trainer" type="button" data-key="G" aria-label="switch trainer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M3 21v-1a6 6 0 0 1 9-5.2M16 14l3 3-3 3M22 17h-7"/></svg></button>
    <button id="respawn" type="button" aria-label="back to the spawn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button id="fullscreen" type="button" data-key="F" aria-label="full screen" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button id="pause-btn" type="button" aria-label="pause"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14M15 5v14"/></svg></button>
    <button id="help" type="button" aria-label="shortcuts">?</button>
  </div>
</div>
<form id="admin-login" class="glass" hidden autocomplete="off"><b>admin login</b>
  <input type="password" placeholder="password" aria-label="admin password" />
  <div><button type="button" data-cancel>cancel</button><button type="submit">log in</button></div>
</form>
<button id="sit-prompt" type="button" hidden><span class="key">press <kbd>E</kbd> to sit</span><span class="tap">tap to sit</span></button>
<div id="hint" class="glass" hidden><b>shortcuts</b>
  <dl><dt>WASD / arrows</dt><dd>walk</dd><dt>Shift</dt><dd>run</dd><dt>Enter</dt><dd>chat</dd><dt>N</dt><dd>day / night</dd><dt>R</dt><dd>rain</dd>
  <dt>E</dt><dd>sit / stand up (near a bench)</dd><dt>Q</dt><dd>laptop / coffee / book (sitting)</dd><dt>G</dt><dd>switch trainer</dd><dt>B</dt><dd>message wall</dd><dt>F</dt><dd>full screen</dd><dt>M</dt><dd>mute</dd><dt>Space</dt><dd>pause</dd></dl></div>
<div id="radio" class="glass">
  <div class="tv"><div id="yt"></div></div>
  <div><small>now playing <button id="mute" type="button" title="mute (M)" aria-label="mute"></button><input id="volume" type="range" min="0" max="100" step="5" title="volume" aria-label="volume" /></small><b id="title">—</b>
    <div id="admin" hidden>
      <button data-action="previous" title="previous">⏮</button>
      <button data-action="restart" title="restart">↺</button>
      <button data-action="next" title="next">⏭</button>
    </div>
  </div>
</div>
<button id="chat-toggle" type="button">chat</button>
<div id="chat" class="glass">
  <header><b>chat</b></header>
  <div id="msgs"></div>
  <form><input id="msg" maxlength="140" autocomplete="off" placeholder="press enter to talk…" /><button id="send" type="submit" title="send" aria-label="send"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></form>
</div>
<div id="enter">
  <div class="box">
    <label class="name-field"><small>your name</small>
      <input id="enter-name" maxlength="16" autocomplete="off" spellcheck="false" /></label>
    <small>choose your trainer</small>
    <div class="genders">
      <button type="button" data-gender="male">male</button>
      <button type="button" data-gender="female">female</button>
    </div>
    <button id="btn-enter">enter the room ▶</button>
  </div>
</div>
<script type="module">
  import { startRadio, pauseRadio, resumeRadio, admin, isMuted, setMuted, getVolume, setVolume } from "/src/radio.js";
  // mute: only for you; the radio keeps running in sync, so unmuting lands on the same second as everyone
  const muteBtn = document.querySelector("#mute");
  const SPEAKER = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/>';
  const drawMute = () => {
    const m = isMuted();
    muteBtn.innerHTML = SPEAKER + (m ? '<path d="m22 9-6 6M16 9l6 6"/></svg>' : '<path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>');
    muteBtn.classList.toggle("on", m);
    muteBtn.title = m ? "unmute (M)" : "mute (M)";
    muteBtn.setAttribute("aria-label", m ? "unmute" : "mute");
  };
  const toggleMute = () => { setMuted(!isMuted()); drawMute(); };
  drawMute();
  muteBtn.addEventListener("click", toggleMute);
  // volume: only for you, remembered; moving the slider while muted unmutes
  const volumeInput = document.querySelector("#volume");
  volumeInput.value = getVolume();
  volumeInput.addEventListener("input", () => {
    setVolume(+volumeInput.value);
    if (isMuted()) { setMuted(false); drawMute(); }
  });
  volumeInput.addEventListener("change", () => volumeInput.blur()); // so the arrow keys go back to walking
  addEventListener("keydown", (e) => {
    const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
    if (!typing && !e.repeat && e.key.toLowerCase() === "m") toggleMute();
  });
  // full screen: only for you (browser feature); hidden where it's unsupported (e.g. iPhone Safari)
  const fsBtn = document.querySelector("#fullscreen");
  const fsRoot = document.documentElement;
  if (fsRoot.requestFullscreen) {
    fsBtn.hidden = false;
    const drawFs = () => {
      const on = !!document.fullscreenElement;
      fsBtn.classList.toggle("on", on);
            fsBtn.setAttribute("aria-label", on ? "exit full screen" : "full screen");
    };
    const toggleFs = () => {
      (document.fullscreenElement ? document.exitFullscreen() : fsRoot.requestFullscreen()).catch(() => {});
    };
    fsBtn.addEventListener("click", () => { toggleFs(); fsBtn.blur(); });
    document.addEventListener("fullscreenchange", drawFs);
    addEventListener("keydown", (e) => {
      const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
      if (!typing && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === "f") toggleFs();
    });
  }
  // admin mode: type /admin in the chat and the password (it's saved after the server accepts it);
  // /logout leaves. The server checks the password (ADMIN_PASSWORD secret); here it only shows the buttons.
  let isAdmin = false;
  try { isAdmin = !!localStorage.getItem("admin-password"); } catch {}
  const panel = document.querySelector("#admin");
  panel.hidden = !isAdmin;
  panel.addEventListener("click", (e) => {
    const action = e.target.closest("button")?.dataset.action;
    if (action) admin[action]();
  });
  // trainer choice: mark the saved one and apply on click
  const genderButtons = [...document.querySelectorAll("[data-gender]")];
  let saved = "male";
  try { saved = localStorage.getItem("gender") === "female" ? "female" : "male"; } catch {}
  const mark = (g) => genderButtons.forEach((b) => b.classList.toggle("on", b.dataset.gender === g));
  mark(saved);
  genderButtons.forEach((b) => b.addEventListener("click", () => {
    mark(b.dataset.gender);
    window.applyGender?.(b.dataset.gender);
  }));
  const pauseScreen = document.querySelector("#enter");
  const btnEnter = document.querySelector("#btn-enter");
  let radioPromise = null;
  const notifyGame = (paused) =>
    window.dispatchEvent(new CustomEvent("game:pause", { detail: paused }));
  function pause() {
    pauseRadio();
    notifyGame(true);
    pauseScreen.hidden = false;
    btnEnter.textContent = "continue ▶";
  }
  function play() {
    pauseScreen.hidden = true;
    notifyGame(false);
    if (radioPromise) {
      resumeRadio();
      return;
    }
    radioPromise = startRadio({ elPlayer: "yt", elTitle: document.querySelector("#title") }).catch((err) => {
      radioPromise = null;
      pause();
      console.error("Could not start the radio", err);
    });
  }
  // name typed on this screen is applied when entering
  const enterName = document.querySelector("#enter-name");
  const enter = () => { window.applyName?.(enterName.value); play(); };
  btnEnter.addEventListener("click", enter);
  enterName.addEventListener("keydown", (e) => {
    e.stopPropagation(); // don't walk, pause or open the chat while typing
    if (e.key === "Enter") { enterName.blur(); enter(); }
  });
  document.querySelector("#pause-btn").addEventListener("click", pause);
  // shortcuts: behind the "?" button; shown once by itself on the first visit
  const hint = document.querySelector("#hint");
  const helpBtn = document.querySelector("#help");
  helpBtn.addEventListener("click", () => {
    hint.classList.remove("fade");
    hint.hidden = !hint.hidden;
    helpBtn.classList.toggle("on", !hint.hidden);
    helpBtn.blur();
  });
  let seen = true;
  try { seen = !!localStorage.getItem("seen-shortcuts"); localStorage.setItem("seen-shortcuts", "1"); } catch {}
  if (!seen && !matchMedia("(pointer: coarse)").matches) {
    btnEnter.addEventListener("click", () => {
      hint.hidden = false;
      setTimeout(() => hint.classList.add("fade"), 6000);
      setTimeout(() => { if (hint.classList.contains("fade")) { hint.hidden = true; hint.classList.remove("fade"); } }, 6500);
    }, { once: true });
  }
  // phones: the chat is a sheet that opens from the button; a dot marks new messages
  const chat = document.querySelector("#chat");
  if (matchMedia("(pointer: coarse)").matches) {
    document.querySelector("#msg").placeholder = "say something…";
  }
  const chatToggle = document.querySelector("#chat-toggle");
  chatToggle.addEventListener("click", () => {
    const open = chat.classList.toggle("open");
    chatToggle.textContent = open ? "close" : "chat";
    chatToggle.classList.remove("unread");
  });
  new MutationObserver(() => {
    if (!chat.classList.contains("open")) chatToggle.classList.add("unread");
  }).observe(document.querySelector("#msgs"), { childList: true });
  addEventListener("keydown", (e) => {
    const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    if (e.code !== "Space" || e.repeat || typing) return;
    e.preventDefault();
    if (pauseScreen.hidden) pause();
    else play();
  });
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
