<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Lofi Lobby</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Silkscreen, monospace; }
  canvas { display: block; image-rendering: pixelated; }
  .glass { position: fixed; background: rgba(10,10,14,.62); border: 1px solid rgba(255,255,255,.14);
           border-radius: 8px; backdrop-filter: blur(6px); color: #F2F2F5; }
  #place { left: 28px; top: 28px; padding: 12px 20px; }
  #place b { display: block; font-size: 22px; font-weight: 400; }
  #place small { color: #A6A8B8; font-size: 12px; }
  #hint { left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 14px; font-size: 12px; color: #A6A8B8; }
  #radio { left: 28px; bottom: 28px; padding: 10px; display: flex; gap: 12px; align-items: center; max-width: 420px; }
  #radio .tv { position: relative; width: 176px; height: 99px; border-radius: 4px; overflow: hidden; background: #000; flex-shrink: 0; pointer-events: none; }
  #radio .tv iframe { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  #radio .tv .tv-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #radio .tv .tv-cover[hidden] { display: none; }
  #radio small { display: block; color: #A6A8B8; font-size: 11px; margin-bottom: 4px; }
  #radio b { display: block; font-weight: 400; font-size: 13px; line-height: 18px; }
  #chat { right: 20px; top: 20px; bottom: 20px; width: 320px; display: flex; flex-direction: column; }
  #chat header { padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,.12); display: flex; justify-content: space-between; align-items: baseline; }
  #chat header b { font-weight: 400; font-size: 18px; }
  #chat header small { color: #A6A8B8; font-size: 11px; }
  #msgs { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
  #msgs .m small { display: block; font-size: 11px; color: #ffc95a; margin-bottom: 2px; }
  #msgs .m span { font-size: 13px; line-height: 19px; overflow-wrap: anywhere; }
  #chat form { padding: 14px 16px 16px; display: flex; gap: 8px; }
  #chat input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: #F2F2F5; background: rgba(0,0,0,.35);
                border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 10px 12px; outline: none; }
  #chat input:focus { border-color: #ffc95a; }
  #chat input::placeholder { color: #7d8094; }
  /* bubble + arrow as a single shape (clip-path): one background, no double
     transparency where the arrow meets the bubble; the outline comes from the shape's drop-shadow */
  .bubble { position: fixed; transform: translate(-50%, -100%); pointer-events: none; z-index: 2;
           transition: opacity .3s; filter: drop-shadow(0 0 0.6px rgba(255,255,255,.55)); }
  .bubble span { display: block; max-width: 220px; padding: 6px 10px 13px; font-size: 12px; line-height: 16px;
                color: #F2F2F5; text-align: center; overflow-wrap: anywhere; background: rgba(0,0,0,.74);
                clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(50% + 6px) calc(100% - 7px),
                                   50% 100%, calc(50% - 6px) calc(100% - 7px), 0 calc(100% - 7px)); }
  #switch-trainer { display: block; margin-top: 8px; font: inherit; font-size: 11px; color: #F2F2F5; background: rgba(0,0,0,.4);
                   border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #switch-trainer:hover { border-color: #ffc95a; color: #ffc95a; }
  .tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; z-index: 1; white-space: nowrap;
         font-size: 10px; line-height: 14px; color: #F2F2F5;
         /* no background: dark outline so it reads over light grass and lamp light */
         text-shadow: 1px 0 0 #000, -1px 0 0 #000, 0 1px 0 #000, 0 -1px 0 #000; }
  #my-name { font: inherit; color: #ffc95a; background: none; border: 0; padding: 0; cursor: pointer; }
  #my-name:hover { text-decoration: underline; }
  #name-input { font: inherit; font-size: 11px; color: #F2F2F5; background: rgba(0,0,0,.4); width: 120px;
              border: 1px solid #ffc95a; border-radius: 4px; padding: 2px 6px; outline: none; }
  #admin { display: flex; gap: 6px; margin-top: 8px; }
  #admin[hidden] { display: none; }
  #admin button { font: inherit; font-size: 14px; color: #F2F2F5; background: rgba(0,0,0,.4);
                  border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #admin button:hover { border-color: #ffc95a; color: #ffc95a; }
  #enter { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,12,.55); backdrop-filter: blur(3px); z-index: 10; }
  #enter[hidden] { display: none; }
  #enter .box { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 28px;
                   background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; color: #F2F2F5; }
  #enter .box small { color: #A6A8B8; font-size: 12px; }
  #enter .genders { display: flex; gap: 10px; }
  #enter .genders button { font-size: 14px; padding: 10px 18px; }
  #enter .genders button.on { border-color: #ffc95a; color: #ffc95a; }
  #enter button { font: inherit; font-size: 18px; color: #F2F2F5; background: rgba(10,10,14,.75); border: 1px solid rgba(255,255,255,.2);
                   border-radius: 8px; padding: 16px 28px; cursor: pointer; }
  #enter button:hover { border-color: #ffc95a; color: #ffc95a; }
  #stick { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; z-index: 3; pointer-events: none;
           border: 1px solid rgba(255,255,255,.25); background: rgba(10,10,14,.25); display: none; }
  #stick.on { display: block; }
  #stick .knob { position: absolute; left: 34px; top: 34px; width: 44px; height: 44px; border-radius: 50%;
                 background: rgba(255,201,90,.55); border: 1px solid #ffc95a; }
  #chat-toggle, #pause-btn { display: none; }

  /* phones and tablets */
  @media (pointer: coarse) {
    canvas { touch-action: none; }
    #hint { display: none; }
    #place { left: 12px; top: calc(12px + env(safe-area-inset-top)); padding: 10px 14px 12px; max-width: calc(100vw - 24px); }
    #place b { font-size: 16px; }
    #place small { display: block; font-size: 10px; }
    #switch-trainer, #pause-btn { font-size: 11px; padding: 6px 10px; }
    #pause-btn { display: inline-block; margin: 10px 0 0 8px; cursor: pointer; font: inherit; font-size: 11px; padding: 6px 10px; color: #F2F2F5; background: rgba(0,0,0,.4);
                 border: 1px solid rgba(255,255,255,.16); border-radius: 6px; }
    #switch-trainer { display: inline-block; margin-top: 10px; }
    #place small { margin-top: 2px; }
    #radio { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100vw - 130px); padding: 6px; gap: 8px; }
    #radio .tv { width: 96px; height: 54px; }
    #radio > div:last-child { min-width: 0; }
    #radio b { font-size: 10px; line-height: 13px; max-height: 26px; overflow: hidden; }
    #radio small { font-size: 9px; }
    #chat-toggle { display: block; position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 4;
                   font: inherit; font-size: 13px; color: #F2F2F5; background: rgba(10,10,14,.75); border: 1px solid rgba(255,255,255,.2);
                   border-radius: 22px; padding: 10px 16px; }
    #chat-toggle.unread::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: #ffc95a; }
    #chat { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 46vh; border-radius: 12px 12px 0 0;
            padding-bottom: env(safe-area-inset-bottom); transform: translateY(100%); transition: transform .2s; z-index: 5; }
    #chat.open { transform: none; }
    body:has(#chat.open) #radio { display: none; } /* the sheet covers it anyway */
    #chat header { padding: 12px 16px 10px; }
    #chat input { font-size: 16px; } /* 16px+ keeps iOS from zooming in */
  }
</style>
</head>
<body>
<div id="place" class="glass"><b>Lofi Lobby</b><small>room lobby · 1 trainer</small>
  <button id="switch-trainer" title="switch trainer (G)">switch trainer · G</button><button id="pause-btn" type="button">pause</button>
</div>
<div id="hint" class="glass">arrows / WASD to walk · Shift to run · space to pause</div>
<div id="radio" class="glass">
  <div class="tv"><div id="yt"></div></div>
  <div><small>now playing</small><b id="title">—</b>
    <div id="admin" hidden>
      <button data-action="previous" title="previous">⏮</button>
      <button data-action="restart" title="restart">↺</button>
      <button data-action="next" title="next">⏭</button>
    </div>
  </div>
</div>
<button id="chat-toggle" type="button">chat</button>
<div id="chat" class="glass">
  <header><b>chat</b><small>you: <button id="my-name" title="change name"></button> ✎</small></header>
  <div id="msgs"></div>
  <form><input id="msg" maxlength="140" autocomplete="off" placeholder="press enter to talk…" /></form>
</div>
<div id="enter">
  <div class="box">
    <small>choose your trainer</small>
    <div class="genders">
      <button type="button" data-gender="male">male</button>
      <button type="button" data-gender="female">female</button>
    </div>
    <button id="btn-enter">enter the room ▶</button>
  </div>
</div>
<script type="module">
  import { startRadio, pauseRadio, resumeRadio, admin } from "/src/radio.js";
  // admin mode: open with ?admin=PASSWORD once (it's saved); ?admin= (empty) turns it off.
  // The password is checked on the server (ADMIN_PASSWORD secret); here it only shows the buttons.
  const p = new URLSearchParams(location.search).get("admin");
  try { if (p !== null) localStorage.setItem("admin-password", p); } catch {}
  let isAdmin = false;
  try { isAdmin = !!localStorage.getItem("admin-password"); } catch {}
  const panel = document.querySelector("#admin");
  panel.hidden = !isAdmin;
  panel.addEventListener("click", (e) => {
    const action = e.target.closest("button")?.dataset.action;
    if (action) admin[action]();
  });
  // trainer choice: mark the saved one and apply on click
  const genderButtons = [...document.querySelectorAll("[data-gender]")];
  let saved = "male";
  try { saved = localStorage.getItem("gender") === "female" ? "female" : "male"; } catch {}
  const mark = (g) => genderButtons.forEach((b) => b.classList.toggle("on", b.dataset.gender === g));
  mark(saved);
  genderButtons.forEach((b) => b.addEventListener("click", () => {
    mark(b.dataset.gender);
    window.applyGender?.(b.dataset.gender);
  }));
  const pauseScreen = document.querySelector("#enter");
  const btnEnter = document.querySelector("#btn-enter");
  let radioPromise = null;
  const notifyGame = (paused) =>
    window.dispatchEvent(new CustomEvent("game:pause", { detail: paused }));
  function pause() {
    pauseRadio();
    notifyGame(true);
    pauseScreen.hidden = false;
    btnEnter.textContent = "continue ▶";
  }
  function play() {
    pauseScreen.hidden = true;
    notifyGame(false);
    if (radioPromise) {
      resumeRadio();
      return;
    }
    radioPromise = startRadio({ elPlayer: "yt", elTitle: document.querySelector("#title") }).catch((err) => {
      radioPromise = null;
      pause();
      console.error("Could not start the radio", err);
    });
  }
  btnEnter.addEventListener("click", play);
  document.querySelector("#pause-btn").addEventListener("click", pause);
  // phones: the chat is a sheet that opens from the button; a dot marks new messages
  const chat = document.querySelector("#chat");
  if (matchMedia("(pointer: coarse)").matches) {
    document.querySelector("#msg").placeholder = "say something…";
    document.querySelector("#switch-trainer").textContent = "switch trainer";
  }
  const chatToggle = document.querySelector("#chat-toggle");
  chatToggle.addEventListener("click", () => {
    const open = chat.classList.toggle("open");
    chatToggle.textContent = open ? "close" : "chat";
    chatToggle.classList.remove("unread");
    chatToggle.style.bottom = open ? "calc(46vh + 10px)" : "";
  });
  new MutationObserver(() => {
    if (!chat.classList.contains("open")) chatToggle.classList.add("unread");
  }).observe(document.querySelector("#msgs"), { childList: true });
  addEventListener("keydown", (e) => {
    const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
    if (e.code !== "Space" || e.repeat || typing) return;
    e.preventDefault();
    if (pauseScreen.hidden) pause();
    else play();
  });
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
