name = "lofi-lobby"
main = "worker/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["web_socket_auto_reply_to_close"]

# static site (Vite build). /ws/* goes through the Worker before the assets.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/ws/*", "/api/*"]

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Sala", to = "Room" }]

# archive yesterday's stats every day (Analytics Engine keeps 3 months)
[triggers]
crons = ["15 0 * * *"]

# game stats (joins, leaves, chat counts; no IP or text), read by /api/stats
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "lofi_lobby"

# which deploy is running: sent to each client, so open tabs reload themselves after a new deploy
[version_metadata]
binding = "VERSION"

# Contributor tag: a player types /github in the chat, proves their GitHub login and gets a badge with the
# number of their pull requests merged in GITHUB_REPO. GITHUB_CLIENT_ID is the Client ID of a GitHub OAuth App
# with "Enable Device Flow" on (it is public, no secret is needed); empty turns the login off.
[vars]
GITHUB_REPO = "YudiG12/lofi-lobby"
GITHUB_CLIENT_ID = "Ov23liuvJkSpoqUXts9B"

# Accounts and their sessions (worker/accounts.js). No database_id here: Wrangler creates the database on
# the first deploy of each account and keeps it linked, so a deploy of your own needs no extra step.
[[d1_databases]]
binding = "DB"
database_name = "lofi-lobby"

# ALLOWED_ORIGINS (optional): extra origins allowed on the WebSocket, comma-separated.
# ADMIN_PASSWORD: secret -> `npx wrangler secret put ADMIN_PASSWORD` (never here)
# CF_ACCOUNT_ID, CF_API_TOKEN (Account Analytics: Read): secrets for /stats, set with `npx wrangler secret put`
