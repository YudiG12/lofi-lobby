name = "lofi-lobby"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# static site (Vite build). /ws/* goes through the Worker before the assets.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/ws/*"]

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Sala", to = "Room" }]

# ALLOWED_ORIGINS (optional): extra origins allowed on the WebSocket, comma-separated.
# ADMIN_PASSWORD: secret -> `npx wrangler secret put ADMIN_PASSWORD` (never here)
